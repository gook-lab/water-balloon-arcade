name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 22 = guk-lab-docs project-verify 가 쓰는 버전(npm 10). npm 10 과 11 은 선택적 peer 를
    # lock 에 다르게 다룬다 — 11 에서 통과한 lock 이 10 의 npm ci 에서 'Missing … from lock
    # file' 로 실패했다(main 의 vite 5 + vitest 4 중첩 vite 8 → esbuild@0.28 누락).
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
