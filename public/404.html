<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>빈 칸이에요 — 물풍선 대작전</title>
    <meta name="theme-color" content="#0e1226" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- 없는 주소에 Vercel 이 주는 정적 한 장. JS 없이 그림 · 글 · 링크만 -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        color: #fff;
        font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        word-break: keep-all;
        background-color: #0e1226;
        background-image:
          linear-gradient(180deg, rgba(14, 18, 38, 0.7) 0%, rgba(14, 18, 38, 0.9) 60%, rgba(14, 18, 38, 0.97) 100%),
          url('/key-art-blur.webp');
        background-size: cover;
        background-position: center;
      }
      main {
        width: min(560px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .art {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 3px solid #1d2338;
        border-radius: 6px;
        background: #2d8a3e;
        box-shadow: 0 0 0 3px #4a5aa0, 0 10px 0 3px rgba(0, 0, 0, 0.35);
      }
      .art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; filter: saturate(0.55) brightness(0.8); }
      /* 그림 가운데에 빈 칸 하나 — 이 주소에는 아무것도 없다는 표시 */
      .art .tile {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 92px;
        height: 92px;
        margin: -46px 0 0 -46px;
        display: grid;
        place-items: center;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #ffd23f;
        background: rgba(14, 18, 38, 0.86);
        border: 3px solid #7fd8ff;
        border-radius: 4px;
        box-shadow: 0 0 0 3px #1d2338, 0 6px 0 3px rgba(0, 0, 0, 0.4);
        text-shadow: 0 3px 0 #1d2338;
      }
      .kicker { margin: 6px 0 0; font-size: 13px; letter-spacing: 4px; color: #7fd8ff; }
      h1 {
        margin: 0;
        font-size: clamp(28px, 8vw, 40px);
        color: #ffd23f;
        text-shadow: 3px 0 0 #1d2338, -3px 0 0 #1d2338, 0 -3px 0 #1d2338, 0 3px 0 #2f8fd8, 0 6px 0 #1d2338;
      }
      p { margin: 0; font-size: 15px; line-height: 1.6; color: #dfe6ff; }
      .home {
        margin-top: 8px;
        display: inline-block;
        padding: 12px 28px;
        font-size: 19px;
        font-weight: 700;
        color: #4a2f00;
        text-decoration: none;
        background: #ffd23f;
        border: 3px solid #1d2338;
        border-radius: 4px;
        box-shadow: 0 5px 0 #c47c00, 0 5px 0 3px #1d2338;
      }
      .home:hover { background: #ffdc66; }
      .home:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="art" aria-hidden="true">
        <img src="/key-art.webp" alt="" width="1536" height="1024" />
        <span class="tile">404</span>
      </div>
      <p class="kicker" aria-hidden="true">WATER BALLOON ARCADE</p>
      <h1>여기는 빈 칸이에요</h1>
      <p>찾는 주소가 맵에 없어요. 처음 화면에서 바로 한 판 해요.</p>
      <a class="home" href="/">처음 화면으로</a>
    </main>
  </body>
</html>
